<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="dsh-balance-pro">
  <title>dsh-balance-pro</title>
  <!-- Brand blue, squared off the way the plugin's own badge is. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7AAFFF"/>
      <stop offset="1" stop-color="#3A60EA"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- Card holder: a card peeking out of the pouch, then the pouch's own
       mouth line, then the clasp. Three shapes, legible down to 16px. -->
  <rect x="24.5" y="14.5" width="15" height="7" rx="3.5" fill="#fff" opacity=".62"/>
  <rect x="18" y="19" width="28" height="28" rx="6" fill="none" stroke="#fff" stroke-width="2.9"/>
  <path d="M18 30h10.5M35.5 30H46" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".72"/>
  <circle cx="41" cy="38.5" r="2.6" fill="#fff"/>
</svg>
