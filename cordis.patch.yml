# dsh-balance-pro —— bundle patch（插件的挂载声明）
#
# `dsh plugin --profile desktop add <pkg>` 会把本包记进 profile 的
# dependencies 和 dsh.profile.bundles；DSH 启动时按 bundle 层栈叠加这段 patch，
# 把插件挂进宿主配置树。浏览器半区由 package.json 的 dsh.client 声明，绑定在
# 这个 name 行上（子路径行不会携带半区，所以这里必须是裸包名）。
#
# 配置项都可被 profile 的 cordis.patch.yml 覆盖（用户的 patch 层在本文件之后）：
#   apiKeyEnv            凭据名，默认 DEEPSEEK_API_KEY
#   baseURL              余额接口前缀，默认 https://api.deepseek.com
#   currency             多币种钱包时优先选的币种，默认 CNY
#   refreshMinutes       宿主后台刷新间隔（分钟），默认 10
#   lowBalanceThreshold  低于该金额时胶囊变琥珀色，默认 10
#   requestTimeoutMs     单次上游请求超时（毫秒），默认 8000
#   pricing              用量 tab 的价目表与峰谷时段（默认是 DeepSeek 官方价目，
#                        见 https://api-docs.deepseek.com/zh-cn/quick_start/pricing）
#   usageDays            近 N 天柱状图，默认 7
#   usageTurnLimit       逐轮列表最多返回多少轮，默认 40
#   usageStorePath       用量账本 JSONL 路径；留空则用 $DSH_HOME/balance-pro-usage.jsonl
- insert:
    - id: dsh-balance-pro
      name: dsh-balance-pro
      config:
        apiKeyEnv: DEEPSEEK_API_KEY
        baseURL: https://api.deepseek.com
        currency: CNY
        refreshMinutes: 10
        lowBalanceThreshold: 10
        requestTimeoutMs: 8000
        # 累计消费（total_costs）与邮箱不在 deepseekAccount 的投影里：开启后宿主会
        # 用同一份账号凭据直接读平台 summary / profile。关掉即完全只用官方服务。
        readTotalCosts: true
        # 用量按本地账本 × 价目表估算：价目单位是「元 / 百万 tokens」。
        # 官方每天 09:00-12:00、14:00-18:00（北京时间，工作日）为高峰，
        # 其余时段及周末为空闲，空闲价为高峰价的一半。
        pricing:
          currency: CNY
          offPeakMultiplier: 0.5
          peakWindows: ['09:00-12:00', '14:00-18:00']
          peakWeekdaysOnly: true
          # 走 DeepSeek 价目表的 provider：含自建的 OpenAI 兼容代理
          # （如 deepseek-openai），它们扣的是同一个钱包。
          providers: [deepseek]
          models:
            deepseek-flash: { cacheHit: 0.04, cacheMiss: 2, output: 8 }
            deepseek-v4-pro: { cacheHit: 0.30, cacheMiss: 9, output: 27 }
          # 其他供应商（Qwen / GLM / Moonshot）的粗略牌价，只用来画图，
          # 永远不进 DeepSeek 的余额账。模型名按前缀匹配，可自行增删。
          catalog:
            qwen:
              label: Qwen
              models:
                qwen3-max: { cacheHit: 2.4, cacheMiss: 2.4, output: 12 }
                qwen-plus: { cacheHit: 0.8, cacheMiss: 0.8, output: 2 }
                qwen3-coder: { cacheHit: 1, cacheMiss: 4, output: 16 }
                qwen-turbo: { cacheHit: 0.3, cacheMiss: 0.3, output: 0.6 }
            glm:
              label: GLM
              models:
                glm-4.6: { cacheHit: 4, cacheMiss: 4, output: 16 }
        usageDays: 7
        usageTurnLimit: 40
        usageStorePath: ''
        # The pill mounts itself and the desktop page is dsh-app://app, so the
        # bundle served for the client-modules row carries the Host's loopback
        # origin. This flag documents that the row is fetched, not bundled.